[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "mipt-ml-hw3-baselines"
version = "0.1.0"
description = "Reproducible non-boosting baselines for 30-day customer spending"
requires-python = ">=3.11,<3.13"
dependencies = ["numpy==2.3.5", "pandas==2.2.3", "scikit-learn==1.7.2", "scipy>=1.14,<2", "joblib>=1.4,<2"]

[project.optional-dependencies]
neural = ["torch==2.5.1"]

[project.scripts]
spend-baselines = "spend_baselines.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
